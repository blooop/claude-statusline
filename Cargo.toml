[package]
name = "claude-statusline"
version = "0.2.1"
edition = "2021"
rust-version = "1.74"
description = "Claude Code status line renderer — a faithful port of the stdlib-Python original"
license = "MIT"
repository = "https://github.com/blooop/claude-statusline"
readme = "README.md"
keywords = ["claude", "statusline", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-statusline"
path = "src/main.rs"

[lib]
name = "claude_statusline"
path = "src/lib.rs"

[dependencies]
# The one dependency, and the only one wanted: the input is a JSON object on
# stdin and nothing else here needs a crate. No date library — the script never
# prints a date, only differences of epoch seconds, so `civil.rs` does the
# ~60 lines of calendar arithmetic that would otherwise pull in chrono.
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = "1"
