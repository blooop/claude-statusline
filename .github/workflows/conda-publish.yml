name: Conda Publish

# Tag-triggered, and that is an ordering requirement rather than a convention:
# `conda.recipe/recipe.yaml` builds from `tag: v${{ version }}`, so the tag has
# to exist before rattler-build can fetch the source. Pushing the tag is
# therefore the one action that both creates the source and starts the build.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# (devlaunch chains this off its Auto-publish workflow instead, because there a
# separate job creates the tag. There is no such job here, so the tag push is
# the trigger directly.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check the tag matches the packaged version
        # The recipe names the package from `Cargo.toml` and fetches the source
        # from `v<that version>`. A tag that disagrees with the file builds
        # something other than the commit that was tagged, which is the failure
        # worth catching here rather than in the artifact.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "could not read a version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "building v$version"

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.38
        with:
          recipe-path: conda.recipe/recipe.yaml
          # `--experimental` is what enables the recipe's `load_from_file`, which
          # is how its version comes from `Cargo.toml` instead of being a second
          # number to bump. It gates that jinja function only; nothing about the
          # package it produces is experimental.
          #
          # The Rust toolchain is a build dependency resolved from the channels
          # (`${{ compiler('rust') }}`), so no toolchain step belongs here — that
          # is what makes the build reproducible from the recipe alone.
          build-args: --experimental --channel conda-forge --no-include-recipe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: conda-packages
          path: output/
          if-no-files-found: error

  publish:
    name: Publish to prefix.dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: conda-packages
          path: output/

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      - name: Upload to prefix.dev
        env:
          PIXI_TOKEN: ${{ secrets.PIXI_TOKEN }}
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            echo "Uploading ${pkg}"
            if pixi exec rattler-build upload prefix \
              -c blooop \
              --api-key "$PIXI_TOKEN" \
              "${pkg}"; then
              echo "Successfully uploaded ${pkg}"
            else
              echo "Failed to upload ${pkg} (may already exist)"
            fi
          done
