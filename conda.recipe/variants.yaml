# Variant config, auto-discovered by rattler-build because it sits next to
# `recipe.yaml` (the render log names it: "Loading variant config from ...").
#
# The one thing it pins is a floor under the Rust compiler. `recipe.yaml` builds
# with `${{ compiler('rust') }}`, which on its own resolves to whatever
# `rust_linux-64` conda-forge happens to serve, with no lower bound. `Cargo.toml`
# declares `rust-version = "1.74"` — `let ... else` and `Option::is_some_and` are
# what put the floor there — and an older compiler is a build failure that would
# land on prefix.dev after the tag already shipped.
#
# A floor, not an exact pin: conda-forge's rust is well past this, so it never
# constrains the solve today — it only refuses a channel offering something too
# old to compile the crate.
rust_compiler_version:
  - ">=1.74"
