schema_version: 1

context:
  # The version is read, not written. `Cargo.toml`'s `[package] version` is the
  # one place it lives; this recipe, the tag the workflow pushes and the tag the
  # source below is fetched from all resolve to it. A release is one edit.
  version: ${{ load_from_file("../Cargo.toml").package.version }}

package:
  name: claude-statusline
  version: ${{ version }}

source:
  # The tag rather than the working tree, which is the ordering requirement
  # `.github/workflows/conda-publish.yml` is built around: pushing `v<version>`
  # is what triggers the build, and only then can this fetch it.
  git: https://github.com/blooop/claude-statusline.git
  tag: v${{ version }}

build:
  number: 0
  script:
    # `--locked` is the point of building from a tag: the dependency versions
    # are `Cargo.lock`'s, not whatever crates.io holds on release day.
    # `--no-track` keeps cargo's install ledger (`.crates.toml`,
    # `.crates2.json`) out of `$PREFIX`, where it would ship as package content.
    - cargo install --locked --no-track --path . --root "${PREFIX}"

requirements:
  build:
    # The C compiler is here for the linker and its sysroot, which is what makes
    # the binary runnable on a glibc older than the build machine's.
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
  # No run requirements, deliberately. Replacing a Python script with a compiled
  # binary is the whole point: the package that lands in a devcontainer must not
  # drag an interpreter in behind it.

tests:
  - script:
      # The binary takes a JSON payload on stdin and has no flags, so "does it
      # run" has to be an actual render. An empty object is the every-field-
      # missing case, which still prints both window slots.
      - test -x "${PREFIX}/bin/claude-statusline"
      - echo '{}' | claude-statusline | grep -q '5h'
      - echo '{}' | claude-statusline | grep -q '7d'
      # Nothing on stdin is the "still loading" hourglass, not a crash.
      - printf '' | claude-statusline | grep -q '⏳'

about:
  homepage: https://github.com/blooop/claude-statusline
  license: MIT
  # Resolved against the fetched source, not against this directory — the git
  # checkout above puts the repo root at the work dir.
  license_file: LICENSE
  summary: Claude Code status line — model, context, rate-limit pacing, session cost
  description: |
    A single binary that reads Claude Code's status-line JSON payload on stdin
    and prints one ANSI-coloured line: the live model, context-window usage, a
    pacing gauge per rate-limit window, and session cost, duration and diff.

    It is a faithful port of the stdlib-Python status line it replaces — same
    output, byte for byte — so it can be dropped into a container that has no
    Python at all.
  documentation: https://github.com/blooop/claude-statusline#readme
  repository: https://github.com/blooop/claude-statusline

extra:
  recipe-maintainers:
    - blooop
